<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>360 全景播放原型 · T2.1</title>
<style>
  /* 设计 Token（浅色 IDE 主题兼容；播放器为深色中性 UI，非紫粉渐变） */
  :root {
    --bg: #14181d;
    --panel: rgba(20, 24, 29, 0.72);
    --text: #f2f5f8;
    --text-dim: #9aa7b4;
    --accent: #3b82f6;
    --danger: #ef4444;
    --radius: 8px;
    --bar-height: 48px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #container { position: fixed; inset: 0; touch-action: none; }
  video { display: none; }

  .bar { position: fixed; left: 0; right: 0; z-index: 10; display: flex; align-items: center;
    gap: 8px; padding: 8px 12px; background: var(--panel); backdrop-filter: blur(8px);
    transition: opacity 0.3s; }
  .bar.hidden { opacity: 0; pointer-events: none; }
  #topbar { top: 0; }
  #controls { bottom: 0; flex-wrap: wrap; }
  .bar button, .bar select {
    background: transparent; color: var(--text); border: 1px solid var(--text-dim);
    border-radius: var(--radius); padding: 6px 12px; font-size: 14px; cursor: pointer;
    min-height: 36px; }
  .bar button:hover, .bar select:hover { border-color: var(--accent); color: var(--accent); }
  .bar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #title { font-size: 14px; color: var(--text-dim); margin-right: auto; }
  #stats { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  #progress-wrap { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; order: -1; }
  #progress { flex: 1; height: 6px; -webkit-appearance: none; appearance: none;
    background: var(--text-dim); border-radius: 3px; outline: none; }
  #progress::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer; }
  #time { font-size: 12px; color: var(--text-dim); min-width: 90px; text-align: center;
    font-variant-numeric: tabular-nums; }

  #overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; flex-direction: column; gap: 12px; background: var(--panel); }
  #overlay.show { display: flex; }
  #overlay .msg { font-size: 16px; }
  #overlay .sub { font-size: 13px; color: var(--text-dim); }

  #loader { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column;
    gap: 12px; align-items: center; justify-content: center; background: var(--bg); }
  #loader input { background: transparent; border: 1px solid var(--text-dim); color: var(--text);
    border-radius: var(--radius); padding: 8px 12px; width: min(520px, 80vw); font-size: 13px; }
  #loader button { background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 10px 24px; font-size: 15px; cursor: pointer; }
  #loader .hint { font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div id="container"></div>
<video id="video" crossorigin="anonymous" playsinline webkit-playsinline loop muted></video>

<div id="loader">
  <div style="font-size:16px">360 全景播放原型</div>
  <input id="src-input" value="./streams/master.m3u8" spellcheck="false">
  <button id="load-btn">加载并播放</button>
  <div class="hint">HLS 多码率流地址（540p/720p/1080p）· 陀螺仪与 VR 需 HTTPS 或 localhost</div>
</div>

<div id="topbar" class="bar hidden">
  <span id="title">360 全景播放原型 T2.1</span>
  <span id="stats"></span>
  <select id="quality">
    <option value="-1">自动</option>
  </select>
</div>

<div id="controls" class="bar hidden">
  <div id="progress-wrap">
    <span id="time">00:00 / 00:00</span>
    <input type="range" id="progress" min="0" max="1000" value="0">
  </div>
  <button id="play-btn">播放</button>
  <button id="mute-btn">音量</button>
  <select id="rate">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1.0x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2.0x</option>
  </select>
  <button id="gyro-btn">陀螺仪 关</button>
  <button id="calib-btn">校准</button>
  <button id="diag-btn">诊断</button>
  <button id="vr-btn" disabled>VR 模式</button>
  <span style="font-size:12px;color:var(--text-dim)">FOV</span>
  <input type="range" id="fov" min="45" max="100" value="75" style="width:90px">
</div>

<div id="overlay">
  <div class="msg" id="overlay-msg"></div>
  <div class="sub" id="overlay-sub"></div>
  <button id="overlay-retry">重试</button>
</div>

<div id="diag" style="display:none;position:fixed;top:60px;right:12px;z-index:30;background:var(--panel);
  border:1px solid var(--text-dim);border-radius:8px;padding:10px;font-size:12px;line-height:1.7;
  max-width:78vw;word-break:break-all;color:var(--text);font-family:monospace;"></div>

<script src="./vendor/hls.min.js"></script>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ========== 子系统 1：球面渲染（TDD §4.2） ==========
   SphereGeometry(500,64,32) 内翻；VideoTexture(flipY=false)；球心相机 fov=75 near=0.1 far=1000。
   注：TDD 原文「vec2(1.0, uv.y)」语义不完整，此处按 equirect 惯例实现，方向校准留 T3.5。 */
const container = document.getElementById('container');
const video = document.getElementById('video');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

const texture = new THREE.VideoTexture(video);
texture.flipY = false;
texture.colorSpace = THREE.SRGBColorSpace;

const sphereGeo = new THREE.SphereGeometry(500, 64, 32);
sphereGeo.scale(-1, 1, 1); // 内翻（相机在球心向外观看）
const sphereMat = new THREE.ShaderMaterial({
  uniforms: { map: { value: texture } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D map;
    varying vec2 vUv;
    void main() {
      gl_FragColor = texture2D(map, vUv);
    }`,
});
scene.add(new THREE.Mesh(sphereGeo, sphereMat));

/* 移动端纹理上限检查（子系统 6）：8K equirect 宽 7680，超过上限的档位自动隐藏并禁选 */
const maxTex = renderer.capabilities.maxTextureSize;
if (maxTex < 4096) console.warn(`maxTextureSize=${maxTex} < 4096，4K equirect 需降采样`);

/* HEVC 硬解探测（8K60 档位的生产路径：HEVC/fMP4；原型阶段仅探测并展示能力） */
const hevcSupported = typeof MediaSource !== 'undefined' &&
  (MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L123.00"') ||
   MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L123.00"'));
console.info(`能力: maxTextureSize=${maxTex}, HEVC=${hevcSupported}`);

/* ========== 子系统 2：拖拽 / 触摸 / 捏合 FOV ========== */
let lon = 0, lat = 0, onPointerDownX = 0, onPointerDownY = 0, onPointerDownLon = 0, onPointerDownLat = 0;
let dragging = false;
const pointers = new Map();
let pinchDist = 0;

const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragging = true;
    onPointerDownX = e.clientX; onPointerDownY = e.clientY;
    onPointerDownLon = lon; onPointerDownLat = lat;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) setFov(camera.fov * (pinchDist / d));
    pinchDist = d;
  } else if (dragging && !gyroOn) {
    lon = onPointerDownLon + (onPointerDownX - e.clientX) * 0.12;
    lat = onPointerDownLat + (e.clientY - onPointerDownY) * 0.12;
    lat = Math.max(-85, Math.min(85, lat));
  }
});
const release = (e) => { pointers.delete(e.pointerId); if (pointers.size === 0) dragging = false; };
el.addEventListener('pointerup', release);
el.addEventListener('pointercancel', release);
el.addEventListener('wheel', (e) => { e.preventDefault(); setFov(camera.fov + e.deltaY * 0.03); }, { passive: false });

const fovSlider = document.getElementById('fov');
function setFov(f) {
  camera.fov = Math.max(45, Math.min(100, f));
  camera.updateProjectionMatrix();
  fovSlider.value = camera.fov;
}
fovSlider.addEventListener('input', () => setFov(Number(fovSlider.value)));

/* ========== 子系统 3：陀螺仪（iOS 权限 + 微信浏览器兼容 + 降级） ========== */
let gyroOn = false;
const gyroBtn = document.getElementById('gyro-btn');
const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90° around X

// 微信内置浏览器（X5/XWeb/WKWebView）差异：部分版本 deviceorientation 不触发或数据为 null，
// 需同时监听 deviceorientationabsolute，并做数据看门狗。
const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
let gyroWatchdog = 0;
let gyroGotData = false;

function orientToQuat(alpha, beta, gamma) {
  const d = Math.PI / 180;
  euler.set(beta * d, alpha * d, -gamma * d, 'YXZ');
  const q = new THREE.Quaternion().setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -screenOrientationAngle() * d));
  return q;
}
function screenOrientationAngle() {
  return (screen.orientation && screen.orientation.angle) || window.orientation || 0;
}
function onDeviceOrientation(e) {
  if (e.alpha === null && e.beta === null && e.gamma === null) { diagData.nullCount++; return; } // 微信部分版本全 null，忽略
  gyroGotData = true;
  diagData.eventCount++;
  diagData.last = { a: e.alpha, b: e.beta, g: e.gamma };
  camera.quaternion.copy(orientToQuat(e.alpha || 0, e.beta || 0, e.gamma || 0)).premultiply(calibOffset);
}

/* ========== 诊断面板（微信内核行为探测） ========== */
const diagData = { eventCount: 0, absCount: 0, nullCount: 0, last: null };
const diagEl = document.getElementById('diag');
let diagTimer = 0;
window.addEventListener('deviceorientationabsolute', () => { diagData.absCount++; });
function renderDiag() {
  diagEl.textContent = [
    'UA: ' + navigator.userAgent,
    'isSecureContext: ' + window.isSecureContext,
    'DeviceOrientationEvent: ' + (typeof DeviceOrientationEvent),
    'requestPermission: ' + (typeof DeviceOrientationEvent !== 'undefined' ? typeof DeviceOrientationEvent.requestPermission : 'n/a'),
    'isWeChat: ' + isWeChat,
    'deviceorientation 触发: ' + diagData.eventCount + ' 次',
    'absolute 触发: ' + diagData.absCount + ' 次',
    '全 null 数据: ' + diagData.nullCount + ' 次',
    '最近值: ' + (diagData.last ? `α=${diagData.last.a?.toFixed(1)} β=${diagData.last.b?.toFixed(1)} γ=${diagData.last.g?.toFixed(1)}` : '无'),
    '陀螺仪状态: ' + (gyroOn ? '开' : '关'),
  ].join('\n');
}
document.getElementById('diag-btn').addEventListener('click', () => {
  const show = diagEl.style.display === 'none';
  diagEl.style.display = show ? 'block' : 'none';
  clearInterval(diagTimer);
  if (show) { renderDiag(); diagTimer = setInterval(renderDiag, 500); }
});
function attachGyroListeners() {
  window.addEventListener('deviceorientation', onDeviceOrientation);
  window.addEventListener('deviceorientationabsolute', onDeviceOrientation); // X5/旧内核回退
  // 看门狗：1.5s 内无有效数据 → 判定内核未提供传感器，降级拖拽
  gyroGotData = false;
  clearTimeout(gyroWatchdog);
  gyroWatchdog = setTimeout(() => {
    if (!gyroGotData) gyroOff(isWeChat ? '微信浏览器未提供陀螺仪数据，已降级为拖拽模式' : '未检测到陀螺仪数据，已降级为拖拽模式');
  }, 1500);
}
async function enableGyro() {
  // iOS 13+ 需用户手势触发权限请求（微信 WKWebView 同样适用，必须在点击调用栈内）
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { gyroOff('权限被拒，已降级为拖拽模式'); return; }
    } catch { gyroOff('权限请求失败，已降级为拖拽模式'); return; }
  }
  attachGyroListeners();
  gyroOn = true;
  gyroBtn.textContent = '陀螺仪 开';
  gyroBtn.classList.add('active');
}
function gyroOff(note) {
  window.removeEventListener('deviceorientation', onDeviceOrientation);
  window.removeEventListener('deviceorientationabsolute', onDeviceOrientation);
  clearTimeout(gyroWatchdog);
  gyroOn = false;
  gyroBtn.textContent = '陀螺仪 关';
  gyroBtn.classList.remove('active');
  if (note) showToast(note);
}
gyroBtn.addEventListener('click', () => (gyroOn ? gyroOff() : enableGyro()));

// 校准：以当前姿态为新的正前方向（微信/不同内核坐标系差异的兜底）
const calibBtn = document.getElementById('calib-btn');
let calibOffset = new THREE.Quaternion();
calibBtn.addEventListener('click', () => {
  calibOffset.copy(camera.quaternion).invert();
  showToast('已校准视角');
});

/* ========== 子系统 4：WebXR 会话生命周期 ========== */
const vrBtn = document.getElementById('vr-btn');
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then((ok) => { vrBtn.disabled = !ok; });
}
vrBtn.addEventListener('click', async () => {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    session.addEventListener('end', () => {
      // 会话结束：Three.js 自动恢复标准渲染，暂停视频避免后台播放
      video.pause();
      updatePlayBtn();
    });
    await renderer.xr.setSession(session);
    video.play();
    updatePlayBtn();
  } catch (err) {
    showToast('VR 会话启动失败：' + err.message);
  }
});
// 会话中断（来电/切 App）自动暂停
document.addEventListener('visibilitychange', () => { if (document.hidden) { video.pause(); updatePlayBtn(); } });

/* ========== 子系统 5：hls.js ABR + 错误恢复 ========== */
let hls = null;
let netRetries = 0;
const MAX_NET_RETRIES = 3;
let backoff = 1000;
const qualitySel = document.getElementById('quality');
const statsEl = document.getElementById('stats');

function attachHls(url) {
  if (hls) hls.destroy();
  netRetries = 0; backoff = 1000;
  if (Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30, capLevelToPlayerSize: false });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
      // 填充画质选择器（自动 + 各档）；超过纹理上限的档位禁选（8K 升级项）
      qualitySel.innerHTML = '<option value="-1">自动</option>';
      let maxAllowed = -1;
      data.levels.forEach((lv, i) => {
        const opt = document.createElement('option');
        opt.value = String(i);
        const overCap = lv.width > maxTex;
        opt.textContent = `${lv.height}p (${(lv.bitrate / 1000).toFixed(0)}k)${overCap ? ' 超纹理上限' : ''}`;
        opt.disabled = overCap;
        if (!overCap) maxAllowed = i;
        qualitySel.appendChild(opt);
      });
      // 自动模式封顶到设备可解码档位，避免 8K 纹理上传失败
      if (maxAllowed >= 0) hls.autoLevelCapping = maxAllowed;
      if (hevcSupported) statsEl.dataset.hevc = 'HEVC✓';
      video.play().catch(() => {});
      updatePlayBtn();
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
      const lv = hls.levels[data.level];
      if (lv) statsEl.dataset.level = `${lv.height}p`;
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        // 网络错误：指数退避重试（3 次）
        if (netRetries < MAX_NET_RETRIES) {
          netRetries++;
          showToast(`网络错误，${backoff / 1000}s 后重试（${netRetries}/${MAX_NET_RETRIES}）`);
          setTimeout(() => hls.startLoad(), backoff);
          backoff = Math.min(backoff * 2, 8000);
        } else {
          showOverlay('网络连接失败', '已重试 3 次，请检查网络后重试');
        }
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        // 媒体解析错误：先恢复，失败则降档
        try {
          hls.recoverMediaError();
        } catch {
          if (hls.currentLevel > 0) { hls.currentLevel = hls.currentLevel - 1; showToast('已切换到更低画质'); }
          else showOverlay('媒体解析失败', '无法恢复播放');
        }
      } else {
        showOverlay('播放失败', '请检查网络或流地址');
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari / HarmonyOS WebView 原生 HLS
    video.src = url;
    video.play().catch(() => {});
    updatePlayBtn();
  } else {
    showOverlay('当前浏览器不支持 HLS', '请使用现代浏览器');
  }
}
qualitySel.addEventListener('change', () => {
  if (!hls) return;
  hls.currentLevel = Number(qualitySel.value); // -1 = 自动
});

/* ========== 子系统 6：性能监测 → 自动降档 ========== */
let frameCount = 0, fpsWindowStart = performance.now(), lowFpsSince = 0;
function fpsTick() {
  frameCount++;
  const now = performance.now();
  if (now - fpsWindowStart >= 1000) {
    const fps = frameCount * 1000 / (now - fpsWindowStart);
    frameCount = 0; fpsWindowStart = now;
    statsEl.textContent = `${fps.toFixed(0)}fps ${statsEl.dataset.level || ''}`.trim();
    if (fps < 30 && hls && hls.autoLevelEnabled) {
      lowFpsSince += 1000;
      if (lowFpsSince >= 3000) {
        // 持续低帧率：降一档
        const lv = hls.currentLevel >= 0 ? hls.currentLevel : hls.loadLevel;
        if (lv > 0) { hls.currentLevel = lv - 1; showToast('帧率过低，已自动降档'); }
        lowFpsSince = 0;
      }
    } else {
      lowFpsSince = 0;
    }
  }
}

/* ========== 播放控制 UI ========== */
const playBtn = document.getElementById('play-btn');
const muteBtn = document.getElementById('mute-btn');
const rateSel = document.getElementById('rate');
const progress = document.getElementById('progress');
const timeEl = document.getElementById('time');

function updatePlayBtn() { playBtn.textContent = video.paused ? '播放' : '暂停'; }
playBtn.addEventListener('click', () => { video.paused ? video.play() : video.pause(); updatePlayBtn(); });
muteBtn.addEventListener('click', () => { video.muted = !video.muted; muteBtn.classList.toggle('active', !video.muted); });
rateSel.addEventListener('change', () => { video.playbackRate = Number(rateSel.value); });

function fmt(t) {
  if (!isFinite(t)) return '00:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
video.addEventListener('timeupdate', () => {
  if (video.duration) progress.value = (video.currentTime / video.duration) * 1000;
  timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
});
progress.addEventListener('input', () => {
  if (video.duration) video.currentTime = (progress.value / 1000) * video.duration;
});

/* 控制栏自动隐藏（3s 无操作） */
let hideTimer = 0;
const bars = [document.getElementById('topbar'), document.getElementById('controls')];
function pokeBars() {
  bars.forEach((b) => b.classList.remove('hidden'));
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => bars.forEach((b) => b.classList.add('hidden')), 3000);
}
['pointermove', 'pointerdown', 'touchstart'].forEach((ev) => el.addEventListener(ev, pokeBars));

/* overlay / toast */
const overlay = document.getElementById('overlay');
function showOverlay(msg, sub) {
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay-sub').textContent = sub || '';
  overlay.classList.add('show');
}
document.getElementById('overlay-retry').addEventListener('click', () => {
  overlay.classList.remove('show');
  attachHls(document.getElementById('src-input').value);
});
let toastTimer = 0;
function showToast(text) {
  statsEl.textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { statsEl.textContent = ''; }, 2500);
  pokeBars();
}

/* ========== 渲染循环 ========== */
renderer.setAnimationLoop(() => {
  if (!gyroOn && !renderer.xr.isPresenting) {
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    camera.lookAt(
      500 * Math.sin(phi) * Math.cos(theta),
      500 * Math.cos(phi),
      500 * Math.sin(phi) * Math.sin(theta),
    );
  }
  fpsTick();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ========== 加载入口 ========== */
document.getElementById('load-btn').addEventListener('click', () => {
  document.getElementById('loader').style.display = 'none';
  attachHls(document.getElementById('src-input').value);
  pokeBars();
});
</script>

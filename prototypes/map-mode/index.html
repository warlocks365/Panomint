<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图模式原型 · T2.2</title>
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --text: #1f2937;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --border: #e5e7eb;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #map { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; z-index: 10; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-width: 240px; }
  #panel h1 { font-size: 14px; color: var(--text); margin-bottom: 8px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row button { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: var(--radius); padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .row button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  #legend { font-size: 11px; color: var(--text-dim); margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>地图模式原型 T2.2</h1>
  <div class="row">
    <button id="btn-amap">中国（高德）</button>
    <button id="btn-osm" class="active">国际（OSM）</button>
  </div>
  <div id="status">加载中…</div>
  <div id="legend">圆点=聚合簇，颜色/大小=照片数；高德模式坐标经 WGS-84→GCJ-02 转换</div>
</div>

<script src="./vendor/maplibre-gl.js"></script>
<script>
/* T2.2 地图模式原型
   - 底图双源：高德（/tiles/amap 反代，GCJ-02）/ OSM（/tiles/osm 反代，WGS-84）
   - 聚合：服务端 /api/map/items（PostGIS 网格聚合），按 bbox+zoom 拉取
   - 坐标：数据存 WGS-84；provider=amap 时服务端转 GCJ-02 后返回（应用层转换不落库） */

let provider = 'osm';
const statusEl = document.getElementById('status');

function tileURL() {
  return window.location.origin + '/tiles/' + provider + '/{z}/{x}/{y}';
}

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      base: { type: 'raster', tiles: [tileURL()], tileSize: 256, attribution: provider === 'amap' ? '高德' : 'OpenStreetMap' },
    },
    layers: [{ id: 'base', type: 'raster', source: 'base' }],
  },
  center: [105, 35], // 默认世界→中国视野
  zoom: 3,
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');

map.on('load', () => {
  map.addSource('clusters', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'cluster-circles',
    type: 'circle',
    source: 'clusters',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['get', 'count'], 1, 6, 50, 14, 200, 22, 600, 32],
      'circle-color': ['interpolate', ['linear'], ['get', 'count'], 1, '#60a5fa', 50, '#2563eb', 200, '#d97706', 600, '#dc2626'],
      'circle-opacity': 0.75,
      'circle-stroke-width': 1,
      'circle-stroke-color': '#ffffff',
    },
  });
  map.addLayer({
    id: 'cluster-count',
    type: 'symbol',
    source: 'clusters',
    layout: { 'text-field': ['get', 'count'], 'text-size': 11 },
    paint: { 'text-color': '#ffffff' },
  });
  refresh();
});

let refreshTimer = 0;
map.on('moveend', () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 200); });

async function refresh() {
  const b = map.getBounds();
  const z = Math.floor(map.getZoom());
  const url = `/api/map/items?min_lng=${b.getWest()}&min_lat=${b.getSouth()}&max_lng=${b.getEast()}&max_lat=${b.getNorth()}&zoom=${z}&provider=${provider}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    const features = data.clusters.map((c) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
      properties: { count: c.count },
    }));
    map.getSource('clusters').setData({ type: 'FeatureCollection', features });
    const total = data.clusters.reduce((s, c) => s + c.count, 0);
    statusEl.innerHTML =
      `底图：${provider === 'amap' ? '高德（GCJ-02 已转换）' : 'OSM（WGS-84）'}<br>` +
      `zoom=${z} · 簇 ${data.clusters.length} · 覆盖点位 ${total}`;
  } catch (e) {
    statusEl.textContent = '聚合数据加载失败：' + e.message;
  }
}

function switchProvider(p) {
  provider = p;
  document.getElementById('btn-amap').classList.toggle('active', p === 'amap');
  document.getElementById('btn-osm').classList.toggle('active', p === 'osm');
  const src = map.getSource('base');
  // MapLibre 不直接改 tiles URL，重建 source
  map.removeLayer('base');
  map.removeSource('base');
  map.addSource('base', { type: 'raster', tiles: [tileURL()], tileSize: 256, attribution: p === 'amap' ? '高德' : 'OpenStreetMap' });
  map.addLayer({ id: 'base', type: 'raster', source: 'base' }, 'cluster-circles');
  refresh();
}
document.getElementById('btn-amap').addEventListener('click', () => switchProvider('amap'));
document.getElementById('btn-osm').addEventListener('click', () => switchProvider('osm'));
</script>
</body>
</html>

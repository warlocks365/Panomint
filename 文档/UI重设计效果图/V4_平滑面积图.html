<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>V4 平滑面积图 · 时间分布 dock 效果图</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e4de;--card:#f4f1ed;--tx:#41403c;--tx2:#7d7a73;--tx3:#a5a29a;--line:#ddd8d0;
--primary:#4a5a6a;--mist:rgba(143,163,173,.16);--r:10px;--ease:cubic-bezier(.32,.72,0,1);
--sh:0 1px 3px rgba(65,64,60,.05),0 10px 34px rgba(65,64,60,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Outfit','Noto Sans SC',sans-serif;font-weight:300;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
.mapbg{position:absolute;inset:0;background:linear-gradient(rgba(233,228,222,.28),rgba(233,228,222,.28)),repeating-linear-gradient(90deg,#cfd8d3 0 90px,#c4cfc9 90px 180px),#d7dfd9;filter:saturate(.42) brightness(1.04)}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:90px 30px 60px}
.dock{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px 12px;position:relative}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hd .tt{font-size:12.5px;font-weight:400;letter-spacing:.14em}
.hd .hint{font-size:11px;color:var(--tx3)}
.hd .range{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--mist);padding:4px 12px;border-radius:6px}
.chart{position:relative;height:130px}
.chart svg{width:100%;height:100%;display:block}
.vline{position:absolute;top:8px;bottom:22px;left:56%;width:1px;background:var(--line);border-left:1px dashed rgba(74,90,106,.4)}
.vdot{position:absolute;top:calc(8px + 18px);left:56%;width:10px;height:10px;border-radius:50%;background:var(--primary);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(74,90,106,.15)}
.vtip{position:absolute;top:-2px;left:calc(56% + 14px);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--tx);background:#f4f1ed;border:1px solid var(--line);border-radius:6px;padding:3px 10px;white-space:nowrap}
.axis{display:flex;justify-content:space-between;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tx3);padding:0 2px}
.brush{position:absolute;left:44%;width:38%;bottom:22px;top:8px;background:rgba(74,90,106,.08);border-left:1px solid var(--primary);border-right:1px solid var(--primary);border-radius:3px}
.brush .hnd{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--card);border:1.5px solid var(--primary);transform:translateY(-50%)}
.brush .hnd.l{left:-6px}.brush .hnd.r{right:-6px}
.note{margin-top:16px;font-size:12px;color:var(--tx2);line-height:1.9}
.note b{font-weight:400;color:var(--tx)}
.vtag{position:absolute;top:-14px;left:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#4a5a6a;background:rgba(143,163,173,.2);border:1px solid rgba(74,90,106,.35);padding:4px 13px;border-radius:6px}
</style>
</head>
<body>
<div class="mapbg"></div>
<div class="wrap">
  <div class="dock">
    <span class="vtag">V4 · 平滑面积图 SOFT AREA</span>
    <div class="hd"><span class="tt">时间分布</span><span class="hint">悬停查看当月（虚线参考线）</span><span class="range">全部时间</span></div>
    <div class="chart">
      <div class="vline"></div><div class="vdot"></div>
      <span class="vtip"><b>2026-08</b> · 17 项</span>
      <svg viewBox="0 0 600 100" preserveAspectRatio="none">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a5a6a" stop-opacity=".34"/><stop offset="1" stop-color="#4a5a6a" stop-opacity=".04"/>
        </linearGradient></defs>
        <path d="M0,74 C50,66 70,76 100,80 C150,88 180,38 220,30 C260,22 290,60 330,62 C370,64 400,42 440,10 C480,-18 540,50 600,54 L600,100 L0,100 Z" fill="url(#ag)"/>
        <path d="M0,74 C50,66 70,76 100,80 C150,88 180,38 220,30 C260,22 290,60 330,62 C370,64 400,42 440,10 C480,-18 540,50 600,54" fill="none" stroke="#4a5a6a" stroke-width="1.5"/>
      </svg>
      <div class="brush"><span class="hnd l"></span><span class="hnd r"></span></div>
    </div>
    <div class="axis"><span>2026-06</span><span>07</span><span>08</span><span>09</span><span>10</span></div>
  </div>
  <p class="note"><b>V4 平滑面积图</b>——柱变平滑曲线 + 雾蓝渐变面积填充；悬停时纵向虚线参考线 + 圆点 + 数值气泡。最能表达「趋势与季节感」，视觉最轻；单月精确对比靠悬停气泡补。</p>
</div>
</body>
</html>

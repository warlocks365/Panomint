<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>V5 点阵密度图 · 时间分布 dock 效果图</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e4de;--card:#f4f1ed;--tx:#41403c;--tx2:#7d7a73;--tx3:#a5a29a;--line:#ddd8d0;
--primary:#4a5a6a;--mist:rgba(143,163,173,.16);--r:10px;--ease:cubic-bezier(.32,.72,0,1);
--sh:0 1px 3px rgba(65,64,60,.05),0 10px 34px rgba(65,64,60,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Outfit','Noto Sans SC',sans-serif;font-weight:300;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
.mono{font-family:'IBM Plex Mono',monospace}
.mapbg{position:absolute;inset:0;background:linear-gradient(rgba(233,228,222,.28),rgba(233,228,222,.28)),repeating-linear-gradient(90deg,#cfd8d3 0 90px,#c4cfc9 90px 180px),#d7dfd9;filter:saturate(.42) brightness(1.04)}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:90px 30px 60px}
.dock{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px 12px;position:relative}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hd .tt{font-size:12.5px;font-weight:400;letter-spacing:.14em}
.hd .hint{font-size:11px;color:var(--tx3)}
.hd .range{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--mist);padding:4px 12px;border-radius:6px}
.matrix{display:flex;gap:10px;align-items:flex-end;height:110px;position:relative}
.mcol{flex:1;height:100%;display:flex;flex-direction:column-reverse;flex-wrap:wrap;align-content:flex-start;gap:3px;cursor:pointer;position:relative;padding:2px 4px;border-radius:6px;transition:background .4s var(--ease)}
.mcol:hover,.mcol.hv{background:var(--mist)}
.mcol .d{width:8px;height:8px;border-radius:2px;background:var(--mist);opacity:.9}
.mcol .d.hi{background:var(--primary)}
.mcol .cnt{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--tx3);margin-top:3px}
.mcol .tip{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--tx);background:#f4f1ed;border:1px solid var(--line);border-radius:6px;padding:3px 10px;white-space:nowrap;z-index:5}
.mcol.hv .tip{opacity:1}
.axis{display:flex;justify-content:space-between;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tx3)}
.note{margin-top:16px;font-size:12px;color:var(--tx2);line-height:1.9}
.note b{font-weight:400;color:var(--tx)}
.vtag{position:absolute;top:-14px;left:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#4a5a6a;background:rgba(143,163,173,.2);border:1px solid rgba(74,90,106,.35);padding:4px 13px;border-radius:6px}
</style>
</head>
<body>
<div class="mapbg"></div>
<div class="wrap">
  <div class="dock">
    <span class="vtag">V5 · 点阵密度图 DOT MATRIX · 1 点 = 1 张</span>
    <div class="hd"><span class="tt">时间分布</span><span class="hint">悬停月高亮 · 点数即数量</span><span class="range">全部时间</span></div>
    <div class="matrix">
      <div class="mcol"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><span class="cnt">8</span></div>
      <div class="mcol"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><span class="cnt">5</span></div>
      <div class="mcol"><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><span class="cnt">17</span><span class="tip"><b>2026-08</b> · 17 项（照片 10 · 视频 4 · 全景 3）</span></div>
      <div class="mcol"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><span class="cnt">11</span></div>
      <div class="mcol"><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><i class="d hi"></i><span class="cnt">24</span></div>
      <div class="mcol"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><span class="cnt">15</span></div>
    </div>
    <div class="axis"><span>2026-06</span><span>07</span><span>08</span><span>09</span><span>10</span></div>
  </div>
  <p class="note"><b>V5 点阵密度图</b>——<b>1 点 = 1 张照片</b>（8px 圆角方点按列堆叠），悬停月整列雾蓝底高亮 + 分解气泡（含类型构成）。颗粒感呼应摄影底片隐喻；媒体量大时（单月 >60）降采样为聚合点 + 「+N」。</p>
</div>
</body>
</html>

# Panomint 群晖 DSM Container Manager 编排（v1.9.2 适配修正版 · 2026-10-02）
# 由 2026-09-27 版逐项对照 v1.9.2 官方模板与后端 env 清单修正：
#   [补] api.TILE_CACHE_DIR —— 原文件挂了 tile-cache 卷但缺此 env，空值=瓦片不缓存（地图每次外网拉取）
#   [补] api.STORAGE_CIPHER_KEY —— v1.9.0+ AI 助手 Key 加密（FailClosed）与存储挂载凭据解密必需；
#        ⚠️ 首次部署前定死并妥善保存（openssl rand -hex 32），更换将无法解密已加密数据
#   [注] 其余服务与卷结构经逐项核对与 v1.9.2 一致，无需改动
# 版本 latest（当前=1.9.2，valkey 固定 8.0-alpine）｜ 访问端口 HTTP 8088 / HTTPS 8443 ｜ 照片目录 /volume1/photo
# 用法：Container Manager → 项目 → 新增 → 项目路径 /volume1/docker/panomint → 粘贴本文件
# 注意：db/valkey/appdata 数据持久化在 /volume1/docker/panomint 下（可按存储池全局替换）

name: panomint

services:
  db:
    image: warlocks/panomint-db:latest
    container_name: panomint-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: pano
      POSTGRES_PASSWORD: "4eb2375814213fd1b566b6206bc261c5"
      POSTGRES_DB: pano_album
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /volume1/docker/panomint/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pano -d pano_album"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: panomint-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /volume1/docker/panomint/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: warlocks/panomint-app:latest
    container_name: panomint-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      API_PORT: "8080"
      APP_ENV: prod
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      VALKEY_ADDR: valkey:6379
      JWT_SECRET: "f17e8e7af37764864ae119a494891109c73911484cd4e1aa40149dd9ce367915"
      MEDIA_ROOT: /data/media
      UPLOAD_DIR: /data/media
      UPLOAD_TMP: /data/uploads
      HLS_DIR: /data/hls
      THUMB_DIR: /data/thumbnails
      TILE_CACHE_DIR: /tile-cache                    # 【v1.9.2 补】地图瓦片缓存（配合下方 tile-cache 卷）
      STORAGE_CIPHER_KEY: "1ba4cd5df878eb38ecf850cfbabda6d99b4659022de66ebb7bda5171052c8d17"  # 【v1.9.0+ 必需】AI Key 加密/挂载凭据解密 · 请另存副本
      TRUSTED_PROXIES: 172.16.0.0/12,192.168.48.0/20
      AMAP_KEY: "9a6182171cfb3a1207fa97b75755cefd"
      AMAP_SECRET: "167425ffdd39f516cb6383a9207ba317"
      HTTPS_CERT_DIR: /etc/pano-certs
      # ---- 可选项（按需取消注释）----
      # UPLOAD_MAX_BYTES: "2147483648"               # 单文件上传上限（字节，默认见后端）
      # SSO_OIDC_ISSUER: ""                          # SSO 登录（v1.8+，需 IdP）
      # SSO_OIDC_CLIENT_ID: ""
      # SSO_OIDC_CLIENT_SECRET: ""
      # SSO_OIDC_REDIRECT_URI: ""
      # SSO_OIDC_SCOPES: "openid profile email"
      # BW_PROBE_BYTES: "8388608"                    # 分享带宽测速参数（可选）
      # BW_PROBE_MAX_MS: "3000"
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
      - /volume1/docker/panomint/tile-cache:/tile-cache
      - /volume1/docker/panomint/certs:/etc/pano-certs
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  embed-worker:
    image: warlocks/panomint-app:latest
    container_name: panomint-embed-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/embedgen", "-mode", "watch", "-interval", "30"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
      EMBED_FAMILY: chinese-clip
      EMBED_MODEL_DIR: /opt/models/chinese-clip
      EMBED_DEVICE: auto
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  tag-worker:
    image: warlocks/panomint-app:latest
    container_name: panomint-tag-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/taggen", "-mode", "watch", "-interval", "60"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
      EMBED_FAMILY: chinese-clip
      EMBED_MODEL_DIR: /opt/models/chinese-clip
      EMBED_DEVICE: auto
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  phash-worker:
    image: warlocks/panomint-app:latest
    container_name: panomint-phash-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/phashgen", "-mode", "watch", "-interval", "30"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  faces-worker:
    image: warlocks/panomint-app:latest
    container_name: panomint-faces-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/facesgen", "-mode", "watch", "-interval", "30"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      MEDIA_ROOT: /data/media
      FACE_MODEL_DIR: /opt/models/faces
      FACE_DEVICE: ""
      EMBED_DEVICE: auto
      FACE_MERGE_SIM: "0.40"
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  index-worker:
    image: warlocks/panomint-worker:latest
    container_name: panomint-index-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WORKER_KIND: index
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      MEDIA_ROOT: /data/media
      HLS_DIR: /data/hls
      INDEX_THUMB_FAST: "1"
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  transcode-worker:
    image: warlocks/panomint-worker:latest
    container_name: panomint-transcode-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WORKER_KIND: transcode
      PG_DSN: postgres://pano:4eb2375814213fd1b566b6206bc261c5@db:5432/pano_album
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      MEDIA_ROOT: /data/media
      HLS_DIR: /data/hls
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:
    image: warlocks/panomint-web:latest
    container_name: panomint-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: panomint-caddy
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8443:443/udp"
    environment:
      SITE_ADDRESS: panomint.warlocks.cn       # 换成你证书的域名
    volumes:
      - /volume1/docker/panomint/certs:/etc/pano-certs:ro
      - /volume1/docker/panomint/caddy:/etc/caddy:ro
    depends_on:
      - web

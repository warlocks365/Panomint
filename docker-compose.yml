# 全景相册系统 - 数据层编排
# 服务: PostgreSQL 16 (+PostGIS 3.4 +pgvector) / Valkey 8 / MinIO
# 依据: TDD v1.1 §2.1 部署拓扑, DDL v1.1
# 许可: Valkey BSD-3-Clause (替代 Redis RSALv2/SSPL); MinIO AGPL 仅作独立 S3 服务调用

name: pano-album

services:
  db:
    build: ./docker/db
    container_name: pano-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pano_album}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb 已移交 goose 迁移体系（T1.2）；01-schema.sql 保留作手工全量重置参考
      # - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: pano-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: pano-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pano}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- API 服务（cmd/api）：经 web 反代对外，不直接暴露宿主机端口 ----
  api:
    # 显式镜像名：embed-worker 复用同一镜像（含 CLIP 模型与 onnxruntime），避免重复构建
    image: panomint-app:latest
    build:
      # 上下文=仓库根：镜像需打包 assets/{models,lib}（CLIP 模型 + ONNX Runtime，Job000010）
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: pano-api
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      JWT_SECRET: ${JWT_SECRET:-pano-dev-jwt-secret-lan-only}
      UPLOAD_DIR: /data/media
      UPLOAD_TMP: /data/uploads
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      THUMB_DIR: /data/thumbnails
      TILE_CACHE_DIR: /tile-cache # Job000009 瓦片缓存（高德 429 限流对策）
      # Job000010 语义搜索的设备选择：cpu|cuda|auto（auto=优先 CUDA，不可用回落 CPU）
      # GPU 部署时把 EMBED_DEVICE 设为 cuda，并把 EMBED_LIB 指向 CUDA 版 onnxruntime 库
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_DEVICE_ID: ${EMBED_DEVICE_ID:-0}
      EMBED_THREADS: ${EMBED_THREADS:-0}
      # 模型族：chinese-clip（默认，中文检索）/ clip（OpenAI CLIP，英文更强）
      # ⚠️ 两族向量空间不同，切换模型族必须重跑 embedgen -mode encode -force 全量重算
      EMBED_FAMILY: ${EMBED_FAMILY:-chinese-clip}
      EMBED_MODEL_DIR: ${EMBED_MODEL_DIR:-/opt/models/chinese-clip}
      # 语义召回余弦距离上限。**留空即按模型族自动取值**
      # （chinese-clip→0.63 / clip→0.78，实测标定）；如需微调再显式设置。
      EMBED_SEMANTIC_MAX_DIST: ${EMBED_SEMANTIC_MAX_DIST:-}
    volumes:
      - mediadata:/data
      - tilecache:/tile-cache
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ---- 增量向量化（Job000010）：复用 api 镜像（已含 CLIP 模型 + onnxruntime）----
  # 清扫式补算：周期性扫描「embedding 为空且已有缩略图」的媒体并补算。
  # 与 index-worker 解耦（不阻塞缩略图生成），天然幂等、自动重试历史失败项。
  embed-worker:
    image: panomint-app:latest
    container_name: pano-embed-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/embedgen", "-mode", "watch", "-interval", "30"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      THUMB_DIR: /data/thumbnails
      # 与 api 保持同一模型族（换族必须全量重算，见 docker/api/Dockerfile 注释）
      EMBED_FAMILY: ${EMBED_FAMILY:-chinese-clip}
      EMBED_MODEL_DIR: ${EMBED_MODEL_DIR:-/opt/models/chinese-clip}
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_DEVICE_ID: ${EMBED_DEVICE_ID:-0}
      EMBED_THREADS: ${EMBED_THREADS:-0}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy

  # ---- 增量 AI 打标（Phase 4）：复用 api 镜像（含 CLIP 文本塔 + onnxruntime）----
  # 清扫式补打标：周期性扫描「已向量化但未 AI 打标」的媒体并零样本打标。
  # ⚠️ 必须与 api/embed-worker 同一模型族，否则标签向量与媒体向量不在同一空间。
  tag-worker:
    image: panomint-app:latest
    container_name: pano-tag-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/taggen", "-mode", "watch", "-interval", "60"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      THUMB_DIR: /data/thumbnails
      # 与 api 保持同一模型族（换族必须全量重算，见 docker/api/Dockerfile 注释）
      EMBED_FAMILY: ${EMBED_FAMILY:-chinese-clip}
      EMBED_MODEL_DIR: ${EMBED_MODEL_DIR:-/opt/models/chinese-clip}
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_DEVICE_ID: ${EMBED_DEVICE_ID:-0}
      EMBED_THREADS: ${EMBED_THREADS:-0}
      # 零样本打标阈值（见 internal/tags/zeroshot.go）；标定后固化
      # TAG_MIN_SIM 留空=按族自动（chinese-clip 0.35 / clip 0.24）；TAG_TOP_RATIO 默认 0.88；TAG_MAX_PER_MEDIA 默认 3
      TAG_MIN_SIM: ${TAG_MIN_SIM:-}
      TAG_TOP_RATIO: ${TAG_TOP_RATIO:-0.88}
      TAG_MAX_PER_MEDIA: ${TAG_MAX_PER_MEDIA:-3}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy

  # ---- 前端静态服务 + API 同源反代（LAN 暴露 8088，供本机 cloudflared 隧道回源；服务器直连 Cloudflare 被阻断）----
  web:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/web/Dockerfile
    container_name: pano-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api

  # ---- 内网 HTTPS 入口（Job000008）：泛域名证书静态挂载，443 反代 web:80 ----
  # 证书文件部署在宿主机 ./docker/caddy/certs/（fullchain.crt + private.pem，权限 600，不入库）
  # 续期：证书 2026-10-13 到期（来此加密手动签发），换新后 docker compose restart caddy
  caddy:
    image: caddy:2-alpine
    container_name: pano-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/certs:/etc/caddy/certs:ro
      - caddydata:/data
    depends_on:
      - web

  # ---- 常驻 Worker（TDD §8.1 方案 A）：缩略图 + HLS 转码队列消费 ----
  # 镜像共用 docker/worker/Dockerfile，由 WORKER_KIND 决定入口分发
  index-worker:
    build:
      context: ./src/backend
      dockerfile: ../../docker/worker/Dockerfile
    container_name: pano-index-worker
    restart: unless-stopped
    environment:
      WORKER_KIND: index
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      # 高德逆地理编码（空=入库不自动填 place；AMAP_SECRET 非空时请求带 sig 签名）
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECRET: ${AMAP_SECRET:-}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  transcode-worker:
    build:
      context: ./src/backend
      dockerfile: ../../docker/worker/Dockerfile
    container_name: pano-transcode-worker
    restart: unless-stopped
    environment:
      WORKER_KIND: transcode
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  miniodata:
  mediadata:
  caddydata:
  tilecache:

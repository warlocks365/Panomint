# 全景相册系统 - 数据层编排
# 服务: PostgreSQL 16 (+PostGIS 3.4 +pgvector) / Valkey 8 / MinIO
# 依据: TDD v1.1 §2.1 部署拓扑, DDL v1.1
# 许可: Valkey BSD-3-Clause (替代 Redis RSALv2/SSPL); MinIO AGPL 仅作独立 S3 服务调用

name: pano-album

services:
  db:
    build: ./docker/db
    container_name: pano-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pano_album}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb 已移交 goose 迁移体系（T1.2）；01-schema.sql 保留作手工全量重置参考
      # - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: pano-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: pano-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pano}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- API 服务（cmd/api）：经 web 反代对外，不直接暴露宿主机端口 ----
  api:
    # 显式镜像名：embed-worker 复用同一镜像（含 CLIP 模型与 onnxruntime），避免重复构建
    image: panomint-app:latest
    build:
      # 上下文=仓库根：镜像需打包 assets/{models,lib}（CLIP 模型 + ONNX Runtime，Job000010）
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: pano-api
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      JWT_SECRET: ${JWT_SECRET:-pano-dev-jwt-secret-lan-only}
      UPLOAD_DIR: /data/media
      UPLOAD_TMP: /data/uploads
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      THUMB_DIR: /data/thumbnails
      TILE_CACHE_DIR: /tile-cache # Job000009 瓦片缓存（高德 429 限流对策）
      # 允许的跨域源。⚠️ 这是**环境相关**配置，不是产品默认值：
      # 通用部署其实不需要任何跨域源 —— 前端由 nginx 同源托管并反向代理 API，同源请求不触发 CORS。
      # 这里显式写出，是为了让"代码默认值去耦"（PG_DSN/VALKEY_ADDR/CORS_ORIGINS 的默认值
      # 改为仅本机开发可用）**不改变现有部署的行为**；新环境请按需覆盖，
      # 或显式设为空（= 不放行任何跨域源）。
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8765,https://192.168.1.117:8443}
      # Job000010 语义搜索的设备选择：cpu|cuda|auto（auto=优先 CUDA，不可用回落 CPU）
      # GPU 部署时把 EMBED_DEVICE 设为 cuda，并把 EMBED_LIB 指向 CUDA 版 onnxruntime 库
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_DEVICE_ID: ${EMBED_DEVICE_ID:-0}
      EMBED_THREADS: ${EMBED_THREADS:-0}
      # 模型族：chinese-clip（默认，中文检索）/ clip（OpenAI CLIP，英文更强）
      # ⚠️ 两族向量空间不同，切换模型族必须重跑 embedgen -mode encode -force 全量重算
      EMBED_FAMILY: ${EMBED_FAMILY:-chinese-clip}
      EMBED_MODEL_DIR: ${EMBED_MODEL_DIR:-/opt/models/chinese-clip}
      # 语义召回余弦距离上限。**留空即按模型族自动取值**
      # （chinese-clip→0.63 / clip→0.78，实测标定）；如需微调再显式设置。
      EMBED_SEMANTIC_MAX_DIST: ${EMBED_SEMANTIC_MAX_DIST:-}
      # 高德（契约 §7）：瓦片反代（Tiles）与 /map/search 地名源都读这两项。
      # ⚠️ 此前只传给了 index-worker，api 容器里根本没有 AMAP_* →
      # /map/search 恒降级（X-Map-Search-Degraded: amap_absent）、瓦片也只能吃磁盘缓存。
      # AMAP_KEY 必须是「Web 服务」类型的 Key；AMAP_SECRET 为数字签名密钥（留空则不签名）。
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECRET: ${AMAP_SECRET:-}
    volumes:
      - mediadata:/data
      - tilecache:/tile-cache
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ---- 增量向量化（Job000010）：复用 api 镜像（已含 CLIP 模型 + onnxruntime）----
  # 清扫式补算：周期性扫描「embedding 为空且已有缩略图」的媒体并补算。
  # 与 index-worker 解耦（不阻塞缩略图生成），天然幂等、自动重试历史失败项。
  embed-worker:
    image: panomint-app:latest
    container_name: pano-embed-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/embedgen", "-mode", "watch", "-interval", "30"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      THUMB_DIR: /data/thumbnails
      # 与 api 保持同一模型族（换族必须全量重算，见 docker/api/Dockerfile 注释）
      EMBED_FAMILY: ${EMBED_FAMILY:-chinese-clip}
      EMBED_MODEL_DIR: ${EMBED_MODEL_DIR:-/opt/models/chinese-clip}
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_DEVICE_ID: ${EMBED_DEVICE_ID:-0}
      EMBED_THREADS: ${EMBED_THREADS:-0}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy

  # ---- 增量 AI 打标（Phase 4）：复用 api 镜像（含 CLIP 文本塔 + onnxruntime）----
  # 清扫式补打标：周期性扫描「已向量化但未 AI 打标」的媒体并零样本打标。
  # ⚠️ 必须与 api/embed-worker 同一模型族，否则标签向量与媒体向量不在同一空间。
  tag-worker:
    image: panomint-app:latest
    container_name: pano-tag-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/taggen", "-mode", "watch", "-interval", "60"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      THUMB_DIR: /data/thumbnails
      # 与 api 保持同一模型族（换族必须全量重算，见 docker/api/Dockerfile 注释）
      EMBED_FAMILY: ${EMBED_FAMILY:-chinese-clip}
      EMBED_MODEL_DIR: ${EMBED_MODEL_DIR:-/opt/models/chinese-clip}
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_DEVICE_ID: ${EMBED_DEVICE_ID:-0}
      EMBED_THREADS: ${EMBED_THREADS:-0}
      # 零样本打标阈值（见 internal/tags/zeroshot.go）
      # TAG_MIN_SIM 留空 = 按族默认（chinese-clip 0.40 / clip 0.24，均经真实库标定）
      # TAG_TOP_RATIO 默认 0.88；TAG_MAX_PER_MEDIA 默认 3
      # ⚠️ api 服务不读 TAG_*：它靠代码内的同族默认值保持一致。若在此覆盖阈值，
      #    必须同步改 zeroshot.go 的默认值（或给 api 也加同名 env），
      #    否则 /ai/tags 的实时预览与 tag-worker 的落库结果会不一致。
      TAG_MIN_SIM: ${TAG_MIN_SIM:-}
      TAG_TOP_RATIO: ${TAG_TOP_RATIO:-0.88}
      TAG_MAX_PER_MEDIA: ${TAG_MAX_PER_MEDIA:-3}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy

  # ---- 感知哈希去重（TDD §381）：复用 app 镜像，但**不需要**任何模型 ----
  # 清扫式增量：周期性扫描「已有 MD 缩略图且 media.phash_scanned_at 为空」的媒体，
  # 解码缩略图 → DCT pHash → 回填 media.phash（64 位，供后续按汉明距离分组找重复）。
  # 与 embed/tag/faces worker 同理不接队列：把 phash_scanned_at 复位即等价入队。
  # 纯 Go 实现（标准库 image + golang.org/x/image），故无需 ONNX/模型环境变量，
  # 也因此不需要挂 EMBED_*/FACE_* 那一堆配置。
  # MD（宽 640）已是 pHash 的充足输入（内部只缩到 32×32），无需 LG。
  phash-worker:
    image: panomint-app:latest
    container_name: pano-phash-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/phashgen", "-mode", "watch", "-interval", "30"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      THUMB_DIR: /data/thumbnails
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy

  # ---- 人脸检测 / 聚类（Job000011）：复用 api 镜像（含 ONNX Runtime + YuNet/SFace 模型）----
  # 清扫式增量：周期性扫描「已有 LG 缩略图且 media.faces_scanned_at 为空」的媒体 →
  # YuNet 检出人脸 → SFace 出 128 维特征 → 与既有簇质心比余弦相似度，
  # ≥ FACE_MERGE_SIM 归入该簇，否则新建簇。
  # 与 embed/tag worker 同理不接队列：POST /ai/faces 复位 faces_scanned_at 即等价入队。
  # ⚠️ 模型缺失会直接 log.Fatalf 退出，restart: unless-stopped 下形成崩溃循环，
  #    故模型必须随镜像固化（见 docker/api/Dockerfile 的 COPY assets/models/faces）。
  faces-worker:
    image: panomint-app:latest
    container_name: pano-faces-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/facesgen", "-mode", "watch", "-interval", "30"]
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      THUMB_DIR: /data/thumbnails
      # 人脸只吃 LG 缩略图（宽 1280），**不读 media.embedding**，故无需 EMBED_MODEL_DIR
      FACE_MODEL_DIR: /opt/models/faces
      # 设备与原生库：FACE_DEVICE 缺省回落 EMBED_DEVICE；FACE_LIB 缺省回落 EMBED_LIB（= 镜像内 ORT）
      # GPU / CPU 双接口保留，由部署环境选择，不因开发机能力裁剪
      FACE_DEVICE: ${FACE_DEVICE:-}
      FACE_DEVICE_ID: ${FACE_DEVICE_ID:-0}
      FACE_THREADS: ${FACE_THREADS:-0}
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_THREADS: ${EMBED_THREADS:-0}
      # 聚类合并余弦阈值（Job000011 标定）：跨照片错并最高 0.347~0.348、真同人最低 0.4382，
      # 取 0.40 居中（两侧余量 0.052 / 0.038）。官方同人判定 0.363 落在错误区间内，不能直接用；
      # 分辨率不是根因（脸 60→217px 异人相似度仅 0.525→0.4999）。剩余重叠由
      # 「同媒体内人脸互不合并」兜底（见 store.go NearestClusters）。
      FACE_MERGE_SIM: ${FACE_MERGE_SIM:-0.40}
      # 检测参数留空即用代码默认：inputSize 640 / conf 0.87 / nms 0.3 / minFacePx 24
      # conf 0.87 = 分离霓虹街景误检（0.861）与最小真脸（0.883）的取值。
      # ⚠️ 分离发生在**置信度轴**上；尺寸轴**不可分**（误检短边 56.7 与合影小脸 24.9~73.0 重叠），
      # 故 minFacePx 保持 24 近乎不设限——不要用 minpx 去滤误检（曾因此毁掉 91% 的合影人脸）
      FACE_CONF: ${FACE_CONF:-}
      FACE_NMS: ${FACE_NMS:-}
      FACE_MIN_PX: ${FACE_MIN_PX:-}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy

  # ---- 前端静态服务 + API 同源反代（LAN 暴露 8088，供本机 cloudflared 隧道回源；服务器直连 Cloudflare 被阻断）----
  web:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/web/Dockerfile
    container_name: pano-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api

  # ---- 入口反代（Job000008）----
  # ⚠️ 这是**环境相关**配置，不是产品默认值：
  #   · 通用部署走默认形态 docker/caddy/Caddyfile —— HTTP（或公网域名自动 ACME），**不需要任何证书文件**；
  #   · 当前部署显式选用 HTTPS 变体：在 .env 里加一行 CADDY_CONFIG=Caddyfile.tls，
  #     证书由部署者放到宿主机 ./docker/caddy/certs/（fullchain.crt + private.pem，权限 600，不入库）。
  # 证书 2026-10-13 到期（来此加密手动签发），换新后 docker compose restart caddy
  # 需要覆盖站点地址/证书路径时，给本服务加 environment（⚠️ 不要传空值：Caddy 用 os.LookupEnv，
  # 空串算"已设置"，会覆盖 Caddyfile 里的安全默认值）：
  #   environment:
  #     SITE_ADDRESS: album.example.com
  caddy:
    image: caddy:2-alpine
    container_name: pano-caddy
    restart: unless-stopped
    # 配置文件由 CADDY_CONFIG 选择（compose 在解析期替换 ${}；未设置或空值都回落到 Caddyfile）。
    # 显式写出完整 argv：官方 caddy:2-alpine 镜像**不带** ENTRYPOINT，其自带 CMD 正是
    # ["caddy","run","--config","/etc/caddy/Caddyfile","--adapter","caddyfile"]，
    # 故这里只是把 config 路径变量化（`docker image inspect caddy:2-alpine` 可复核）。
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:-Caddyfile}", "--adapter", "caddyfile"]
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      # 整个目录只读挂入（而非单文件）：两个变体都在容器内可见，CADDY_CONFIG 写错时
      # Caddy 会明确报"文件不存在"，不会像单文件挂载那样被 Docker 静默建成空目录。
      - ./docker/caddy:/etc/caddy:ro
      - caddydata:/data
    depends_on:
      - web

  # ---- 常驻 Worker（TDD §8.1 方案 A）：缩略图 + HLS 转码队列消费 ----
  # 镜像共用 docker/worker/Dockerfile，由 WORKER_KIND 决定入口分发
  index-worker:
    build:
      context: ./src/backend
      dockerfile: ../../docker/worker/Dockerfile
    container_name: pano-index-worker
    restart: unless-stopped
    environment:
      WORKER_KIND: index
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      # 高德逆地理编码（空=入库不自动填 place；AMAP_SECRET 非空时请求带 sig 签名）
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECRET: ${AMAP_SECRET:-}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  transcode-worker:
    build:
      context: ./src/backend
      dockerfile: ../../docker/worker/Dockerfile
    container_name: pano-transcode-worker
    restart: unless-stopped
    environment:
      WORKER_KIND: transcode
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  miniodata:
  mediadata:
  caddydata:
  tilecache:

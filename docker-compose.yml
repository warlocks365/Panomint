# 全景相册系统 - 数据层编排
# 服务: PostgreSQL 16 (+PostGIS 3.4 +pgvector) / Valkey 8 / MinIO
# 依据: TDD v1.1 §2.1 部署拓扑, DDL v1.1
# 许可: Valkey BSD-3-Clause (替代 Redis RSALv2/SSPL); MinIO AGPL 仅作独立 S3 服务调用

name: pano-album

services:
  db:
    build: ./docker/db
    container_name: pano-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pano_album}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb 已移交 goose 迁移体系（T1.2）；01-schema.sql 保留作手工全量重置参考
      # - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: pano-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: pano-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pano}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- API 服务（cmd/api）：经 web 反代对外，不直接暴露宿主机端口 ----
  api:
    build:
      context: ./src/backend
      dockerfile: ../../docker/api/Dockerfile
    container_name: pano-api
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      JWT_SECRET: ${JWT_SECRET:-pano-dev-jwt-secret-lan-only}
      UPLOAD_DIR: /data/media
      UPLOAD_TMP: /data/uploads
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      THUMB_DIR: /data/thumbnails
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ---- 前端静态服务 + API 同源反代（LAN 暴露 8088，供本机 cloudflared 隧道回源；服务器直连 Cloudflare 被阻断）----
  web:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/web/Dockerfile
    container_name: pano-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api

  # ---- 常驻 Worker（TDD §8.1 方案 A）：缩略图 + HLS 转码队列消费 ----
  # 镜像共用 docker/worker/Dockerfile，由 WORKER_KIND 决定入口分发
  index-worker:
    build:
      context: ./src/backend
      dockerfile: ../../docker/worker/Dockerfile
    container_name: pano-index-worker
    restart: unless-stopped
    environment:
      WORKER_KIND: index
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      # 高德逆地理编码（空=入库不自动填 place；AMAP_SECRET 非空时请求带 sig 签名）
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECRET: ${AMAP_SECRET:-}
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  transcode-worker:
    build:
      context: ./src/backend
      dockerfile: ../../docker/worker/Dockerfile
    container_name: pano-transcode-worker
    restart: unless-stopped
    environment:
      WORKER_KIND: transcode
      PG_DSN: postgres://${POSTGRES_USER:-pano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pano_album}
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
    volumes:
      - mediadata:/data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  miniodata:
  mediadata:

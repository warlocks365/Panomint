# 全景相册 CI（Phase 6 T6.3）
#
# 范围（用户裁决）：**仅构建 + 测试 + 静态检查**；部署维持现有本地 SFTP 流程，不进 CI。
# 因此本工作流**不使用任何 secrets**（只需默认 GITHUB_TOKEN）。
#
# Job 一览：
#   backend           —— go vet + CGO_ENABLED=0 go test ./...（全部单测；无需 ORT/模型，实测约 22s）
#   backend-cgo       —— 取 ONNX Runtime 原生库后 CGO_ENABLED=1 go build ./cmd/api（验证 CGO 链路）
#   frontend          —— npm ci && npm run build + scan_undef 未定义引用扫描
#   quality-gates     —— 四道仓库级守卫（P0 规则/前端组织/反代前缀/未定义标识符）
#   nodeagent-matrix  —— 算力节点 agent 三平台交叉编译 smoke（Job000057）
#   debugctl-matrix   —— 调试通道参考 agent 三平台交叉编译 smoke（Job000121）
#
# ⚠️ 说明：embed 包对 ORT 采用**运行时 dlopen 动态加载**（见 docker/api/Dockerfile 把 .so 放到
#    运行阶段 / EMBED_LIB 指向它），编译期只需 gcc（模块自带 c_api 头文件 + -ldl）。
#    故 backend-cgo 下载 ORT 库的目的有二：① 验证资产可获取；② 为将来可能的静态链接预留。

name: CI

on:
  push:
    branches: [main]
    # Job000122 治本：纯文档/记忆类推送不烧 CI（go vet/test、npm build 与文档零交互；
    # 质量门含反代前缀等结构性守卫，故仍保留 scripts/ 变更触发——只豁免内容型路径）。
    paths-ignore:
      - 'README.md'
      - 'overview.md'
      - 'licenses.csv'
      - '文档/**'
      - '工作日志/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.29.0"
  ORT_ASSET: onnxruntime-linux-x64-1.29.0

jobs:
  backend:
    name: backend (vet + test, no CGO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: go vet
        run: go vet ./...

      # CGO_ENABLED=0 时 embed 走 clip_nocgo.go 占位实现，单测无需 ORT 与模型
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  backend-cgo:
    name: backend (CGO build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: 安装 C 工具链
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: 获取 ONNX Runtime 原生库（仅原生库，不含模型）
        run: |
          set -euo pipefail
          mkdir -p assets/lib
          if [ ! -d "assets/lib/${ORT_ASSET}" ]; then
            curl -fSL --retry 3 -o /tmp/ort.tgz \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_ASSET}.tgz"
            tar xzf /tmp/ort.tgz -C assets/lib
          fi
          ls -la "assets/lib/${ORT_ASSET}/lib"

      - name: CGO 构建 api
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -o /tmp/api ./cmd/api

      - name: 确认产物
        run: file /tmp/api && ls -lh /tmp/api

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: 确认产物
        run: ls -lh dist | head -20

  # Job000057/000078：质量门——四道仓库级守卫（纯 stdlib Python，无额外依赖）。
  # 这是"规则进机器"的落点：P0 视觉规则/前端组织/反代两组前缀/未定义标识符，任何一路漂移即红。
  quality-gates:
    name: quality gates（四道守卫）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: P0 规则守卫（emoji 图标/紫粉渐变/AI 模板味/硬编码颜色棘轮）
        run: python scripts/p0_guard.py

      - name: 前端组织守卫（行数棘轮 + 图标库锁定）
        run: python scripts/frontend_org_guard.py

      - name: 反代两组前缀核验（后端路由/前端 SPA/nginx 三方真源比对）
        run: python scripts/verify_reverse_proxy.py

      # Job000078：vite 把未定义标识符当全局量（构建/守卫全失明，运行期 setup 才炸——
      # TagsView 自 Job000058-3 潜伏两 Job 的事故）。高信号静态兜底：模板裸标识符绑定必须有定义。
      - name: 前端未定义标识符扫描（模板事件绑定裸引用/调用）
        run: python scripts/scan_undef.py src/frontend/src

  # Job000057：算力节点 agent 三平台编译 smoke（T6.2「Win/Linux/macOS 三平台」
  # 的交付证据——Go 交叉编译即三平台，矩阵钉死不许悄悄破窗）。
  nodeagent-matrix:
    name: nodeagent 跨平台编译（windows/linux/darwin）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [{goos: windows, ext: .exe}, {goos: linux, ext: ""}, {goos: darwin, ext: ""}]
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: GOOS=${{ matrix.target.goos }} 编译
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o "/tmp/nodeagent${{ matrix.target.ext }}" ./cmd/nodeagent

      - name: 确认产物
        run: file "/tmp/nodeagent${{ matrix.target.ext }}" && ls -lh "/tmp/nodeagent${{ matrix.target.ext }}"

  # Job000121：调试通道参考 agent 三平台编译 smoke（与 nodeagent-matrix 同矩阵钉死，
  # 防"本机编过、别的平台悄悄破窗"——纯标准库 + coder/websocket，无 CGO）。
  debugctl-matrix:
    name: debugctl 跨平台编译（windows/linux/darwin）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [{goos: windows, ext: .exe}, {goos: linux, ext: ""}, {goos: darwin, ext: ""}]
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: GOOS=${{ matrix.target.goos }} 编译
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o "/tmp/debugctl${{ matrix.target.ext }}" ./cmd/debugctl

      - name: 确认产物
        run: file "/tmp/debugctl${{ matrix.target.ext }}" && ls -lh "/tmp/debugctl${{ matrix.target.ext }}"

# 全景相册 CI（Phase 6 T6.3）
#
# 范围（用户裁决）：**仅构建 + 测试 + 静态检查**；部署维持现有本地 SFTP 流程，不进 CI。
# 因此本工作流**不使用任何 secrets**（只需默认 GITHUB_TOKEN）。
#
# 三个 job：
#   backend     —— go vet + CGO_ENABLED=0 go test ./...（全部单测；无需 ORT/模型，实测约 22s）
#   backend-cgo —— 取 ONNX Runtime 原生库后 CGO_ENABLED=1 go build ./cmd/api（验证 CGO 链路）
#   frontend    —— npm ci && npm run build
#
# ⚠️ 说明：embed 包对 ORT 采用**运行时 dlopen 动态加载**（见 docker/api/Dockerfile 把 .so 放到
#    运行阶段 / EMBED_LIB 指向它），编译期只需 gcc（模块自带 c_api 头文件 + -ldl）。
#    故 backend-cgo 下载 ORT 库的目的有二：① 验证资产可获取；② 为将来可能的静态链接预留。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.29.0"
  ORT_ASSET: onnxruntime-linux-x64-1.29.0

jobs:
  backend:
    name: backend (vet + test, no CGO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: go vet
        run: go vet ./...

      # CGO_ENABLED=0 时 embed 走 clip_nocgo.go 占位实现，单测无需 ORT 与模型
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  backend-cgo:
    name: backend (CGO build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: 安装 C 工具链
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: 获取 ONNX Runtime 原生库（仅原生库，不含模型）
        run: |
          set -euo pipefail
          mkdir -p assets/lib
          if [ ! -d "assets/lib/${ORT_ASSET}" ]; then
            curl -fSL --retry 3 -o /tmp/ort.tgz \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_ASSET}.tgz"
            tar xzf /tmp/ort.tgz -C assets/lib
          fi
          ls -la "assets/lib/${ORT_ASSET}/lib"

      - name: CGO 构建 api
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -o /tmp/api ./cmd/api

      - name: 确认产物
        run: file /tmp/api && ls -lh /tmp/api

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: 确认产物
        run: ls -lh dist | head -20

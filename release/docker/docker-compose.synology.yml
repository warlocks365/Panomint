# ============================================================================
# Panomint 全景相册系统 · 群晖 DSM Container Manager 部署编排（v1.9.6）
# 镜像：warlocks/panomint-{app,worker,db,web}:1.9.6（Docker Hub 公开仓库）
# 用法：Container Manager → 项目 → 新增 → 项目路径选 /volume1/docker/panomint → 粘贴本文件
# 访问：http://群晖IP:8088 —— 首次访问进入初始化向导
# 改值：仅 2 处【必填】——数据库口令（须与 7 条 PG_DSN 同值）、JWT 密钥
# 路径：宿主路径按 DSM 默认存储池 /volume1 编写，多存储池请全局替换
# ============================================================================
name: panomint

services:

  # ---- 数据库（PostgreSQL 16 + PostGIS 3 + pgvector）----
  db:
    image: warlocks/panomint-db:1.9.6
    container_name: panomint-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: pano
      POSTGRES_PASSWORD: "请改成强随机口令"           # 【必填】生成：openssl rand -hex 16
      POSTGRES_DB: pano_album
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 数据库持久化：容器重建/升级不丢数据；首次启动目录必须为空（PG 自动初始化）
      - /volume1/docker/panomint/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- 队列/缓存（Valkey，任务排队与状态）----
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: panomint-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /volume1/docker/panomint/valkey:/data         # 队列持久化
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- API 主服务（启动自动建库迁移；仅经 web 反代访问，不直接映射端口）----
  api:
    image: warlocks/panomint-app:1.9.6
    container_name: panomint-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      API_PORT: "8080"
      APP_ENV: prod
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album   # 【必填】口令与 db.POSTGRES_PASSWORD 同值
      VALKEY_ADDR: valkey:6379
      JWT_SECRET: "请用 openssl rand -hex 32 生成"    # 【必填】登录令牌签名密钥
      MEDIA_ROOT: /data/media
      UPLOAD_DIR: /data/media
      UPLOAD_TMP: /data/uploads
      HLS_DIR: /data/hls
      THUMB_DIR: /data/thumbnails
      TILE_CACHE_DIR: /tile-cache
      STORAGE_CIPHER_KEY: "请用 openssl rand -hex 32 生成并另存副本"  # 【v1.9.0+ 必填】AI Key 加密/挂载凭据解密（FailClosed）；更换将无法解密已加密数据
      CORS_ORIGINS: ""                                # 同源部署留空
      # AgentPano LLM 上游私网白名单（本地大模型部署用）。留空 = 拒绝全部私网。
      # 精确匹配；云元数据地址即使写入也永不生效。
      AGENT_LLM_ALLOWED_HOSTS: ""
      TRUSTED_PROXIES: 172.16.0.0/12                  # Docker 桥接默认段，一般不改
      AMAP_KEY: ""                                    # 高德 Web 服务 Key（可选，空=地名搜索降级）
      AMAP_SECRET: ""
      EMBED_DEVICE: auto                              # NAS 无 GPU 保持 auto（走 CPU）
    volumes:
      - /volume1/docker/panomint/data:/data           # 应用数据根（缩略图/HLS/上传临时区，持久化）
      # ★媒体照片目录：左侧改成 NAS 上实际的照片文件夹（全部 7 处保持一致）
      - /volume1/photo:/data/media
      - /volume1/docker/panomint/tile-cache:/tile-cache
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ---- AI 工作器×4（语义搜索/自动打标/重复清理/人物识别；内存紧张可整段删除）----
  embed-worker:
    image: warlocks/panomint-app:1.9.6
    container_name: panomint-embed-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/embedgen", "-mode", "watch", "-interval", "30"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
      EMBED_FAMILY: chinese-clip                      # 改 clip 须全库重算向量
      EMBED_MODEL_DIR: /opt/models/chinese-clip
      EMBED_DEVICE: auto
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  tag-worker:
    image: warlocks/panomint-app:1.9.6
    container_name: panomint-tag-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/taggen", "-mode", "watch", "-interval", "60"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
      EMBED_FAMILY: chinese-clip
      EMBED_MODEL_DIR: /opt/models/chinese-clip
      EMBED_DEVICE: auto
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  phash-worker:
    image: warlocks/panomint-app:1.9.6
    container_name: panomint-phash-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/phashgen", "-mode", "watch", "-interval", "30"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  faces-worker:
    image: warlocks/panomint-app:1.9.6
    container_name: panomint-faces-worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/facesgen", "-mode", "watch", "-interval", "30"]
    environment:
      TZ: Asia/Shanghai
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album
      THUMB_DIR: /data/thumbnails
      MEDIA_ROOT: /data/media
      FACE_MODEL_DIR: /opt/models/faces
      FACE_DEVICE: ""                                 # 留空=CPU；有 NVIDIA GPU 可填 cuda
      EMBED_DEVICE: auto
      FACE_MERGE_SIM: "0.40"
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy

  # ---- 重活工作器×2（缩略图索引 + 视频转 HLS；只存照片可删 transcode-worker）----
  index-worker:
    image: warlocks/panomint-worker:1.9.6
    container_name: panomint-index-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WORKER_KIND: index
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
      AMAP_KEY: ""
      AMAP_SECRET: ""
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  transcode-worker:
    image: warlocks/panomint-worker:1.9.6
    container_name: panomint-transcode-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WORKER_KIND: transcode
      PG_DSN: postgres://pano:请改成强随机口令@db:5432/pano_album
      VALKEY_ADDR: valkey:6379
      FFMPEG_PATH: /usr/bin
      THUMB_DIR: /data/thumbnails
      UPLOAD_DIR: /data/media
      HLS_DIR: /data/hls
      MEDIA_ROOT: /data/media
    volumes:
      - /volume1/docker/panomint/data:/data
      - /volume1/photo:/data/media
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ---- Web 入口（nginx 前端 + API 反代；对外唯一端口）----
  web:
    image: warlocks/panomint-web:1.9.6
    container_name: panomint-web
    restart: unless-stopped
    ports:
      # 左=宿主机端口（冲突可改，如 "8920:80"）；右=容器端口固定 80
      - "8088:80"
    depends_on:
      - api
